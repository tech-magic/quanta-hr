---
- name: Update and upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist
  register: apt_update
  changed_when: false

- debug:
    var: apt_update.stdout_lines

- name: Add Deadsnakes PPA
  apt_repository:
    repo: "ppa:deadsnakes/ppa"
    state: present
    filename: "deadsnakes"
    update_cache: yes

- name: Install common dependencies
  apt:
    name:
      - build-essential
      - software-properties-common
      - command-not-found
      - gnupg
      - ca-certificates
      - curl
      - unzip
      - git
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libffi-dev
      - liblzma-dev
      - pkg-config
      - make
      - libncurses5-dev
      - libgdbm-dev
      - python3-venv
    state: present
    update_cache: yes

- name: Create pyenv root directory
  file:
    path: "{{ pyenv_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Clone pyenv repository
  git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ pyenv_root }}"
    version: master
    update: no

- name: Ensure pyenv environment variables are set for all users
  copy:
    dest: /etc/profile.d/pyenv.sh
    content: |
      export PYENV_ROOT="{{ pyenv_root }}"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"
    owner: root
    group: root
    mode: "0755"

- name: Install Python via pyenv
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    pyenv install -s {{ python_version }}
  args:
    executable: /bin/bash

- name: Verify custom python installation
  shell: |
    {{ python_executable }} --version
  register: verify_output
  changed_when: false

- name: Display verification output
  debug:
    msg: "{{ verify_output.stdout_lines }}"
